aid: nuvig-therapeutics
name: Nuvig Therapeutics
description: 'Nuvig Therapeutics, Inc. is a privately held, clinical-stage biotechnology
  company headquartered at 3450 Hillview Avenue, Palo Alto, California, developing
  next-generation immunomodulators for chronic autoimmune and inflammatory disease.
  Its lead investigational candidate, NVG-2089, is an engineered Fc fragment designed
  to selectively engage type II Fc receptors and harness an endogenous regulatory
  mechanism that resolves autoimmune dysregulation while preserving normal immune
  function; the first patient was dosed in a Phase 2 trial in chronic inflammatory
  demyelinating polyneuropathy (CIDP) in May 2025. The company announced a $161 million
  Series B financing in December 2024. Nuvig is a therapeutics developer, not a software
  vendor: as of August 2026 it publishes no developer portal, API reference, SDK,
  GitHub organization, or machine-readable API contract of any kind. Its public web
  surface is a corporate WordPress site covering science, pipeline, team, news and
  careers, from which the only machine-readable artifact published is a Yoast-generated
  llms.txt.'
